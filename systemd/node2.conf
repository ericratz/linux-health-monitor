# node2 overrides - a systemd drop-in, not a replacement unit.
#
# Install to /etc/systemd/system/health-monitor.service.d/node2.conf and leave
# health-monitor.service itself byte-identical to the repo's copy on every host.
#
# Why a drop-in rather than editing the unit: per-host values that live inside
# the unit file are destroyed by the next upgrade, because upgrading means
# copying the repo's unit over the installed one. Hand-edited config that an
# upgrade silently reverts is how a node ends up running yesterday's settings
# with today's code - and the failure is invisible, since the service still
# starts and still reports. A drop-in survives the copy and re-applies itself.
#
# Later assignments win, so each line below overrides the main unit's value:
# HEALTH_SERVICES is replaced, HEALTH_CONTAINER_USER is added, and everything
# the main unit sets and this file does not mention (HEALTH_VIP,
# HEALTH_APP_ENDPOINTS, the journal window) is inherited unchanged.

[Service]

# RHEL family, rootless Podman. sshd, not ssh; firewalld is watched here
# because this is the node that runs one.
#
# Do NOT add the application's Quadlet unit to this list. It runs under
# `systemctl --user`; the monitor runs as root against the system manager,
# which has never heard of it, so it would report `not-installed` forever -
# which reads as "the app is not deployed" rather than "wrong manager".
# Application liveness here comes from the container check below and from
# HEALTH_APP_ENDPOINTS in the main unit.
Environment=HEALTH_SERVICES=nginx,keepalived,prometheus,sshd,firewalld

# Rootless containers belong to the user that started them: root's `podman ps`
# queries root's own empty store and reports nothing.
Environment=HEALTH_CONTAINER_USER=ericratz

# Required by the line above. HEALTH_CONTAINER_USER runs `su -`, which needs
# the target user's home directory to build their login session; the main
# unit's ProtectHome=yes hides it.
ProtectHome=no
